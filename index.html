<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CluckOps v0.6</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f7f7f2}*{box-sizing:border-box}body{margin:0}.app{max-width:900px;margin:0 auto;padding:24px 20px 100px}header,.section-head,.profile-head,.actions{display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow,small,.muted{color:#6b7280;font-size:12px}h1,h2,h3,p{margin-top:0}.stats,.two{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.two{grid-template-columns:repeat(2,1fr)}.card{background:#fff;border:1px solid #deded5;border-radius:18px;padding:16px;text-align:left}.stat{display:flex;flex-direction:column;gap:5px}.stat strong{font-size:18px}.big{font-size:28px}.list{display:flex;flex-direction:column}.cards{gap:10px}.row{display:grid;grid-template-columns:70px 30px 1fr;align-items:center;padding:13px 0;border-bottom:1px solid #deded5}.chicken-card,.offender{display:flex;justify-content:space-between;align-items:center;width:100%}.chicken-card small,.offender small{display:block;margin-top:4px}.profile-head{justify-content:flex-start;margin:20px 0}.avatar{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:white;border:1px solid #deded5;font-size:40px}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.btn.primary{background:#dbeafe;color:#1f2937}.btn.ghost{background:white;border:1px solid #deded5}.zone{position:relative;height:240px;margin:14px 0;display:grid;place-items:center}.house{font-size:58px}.line{position:absolute;left:0;right:0;top:50%;border-top:2px dashed #9ca3af}.zone-label{position:absolute;font-size:11px;background:#fff;padding:5px 7px;border-radius:8px}.zone-label.top{top:12px;left:12px}.zone-label.bottom{bottom:12px;left:12px}.feed{height:210px;border:1px solid #deded5;border-radius:14px;background:#f2f2ec;display:grid;place-items:center;font-size:58px}.chip{border:1px solid #deded5;background:#fff;border-radius:10px;padding:8px 10px}.alert,.pattern{margin-bottom:10px}.pattern{border-style:dashed}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;padding:16px;z-index:10}.modal{background:#fff;border-radius:20px;padding:20px;width:min(560px,100%);max-height:85vh;overflow:auto}form{display:flex;flex-direction:column;gap:14px}label{font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:6px}input,select,textarea{font:inherit;padding:12px;border-radius:12px;border:1px solid #d1d5db;background:#fff}textarea{min-height:90px}section{margin:24px 0}.hidden{display:none!important}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:4px;background:rgba(255,255,255,.96);border-top:1px solid #deded5;padding:8px;z-index:5}nav button{background:transparent;border:0;padding:8px 10px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}nav button.active{background:#eef2ff}.toast{margin-top:12px;font-size:13px;color:#374151}.danger{color:#92400e}.attention{color:#92400e}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#f3f4f6;font-size:11px}.alert-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.history-title{display:flex;justify-content:space-between;gap:12px;align-items:center}@media(max-width:640px){.app{padding:18px 14px 100px}.stats{grid-template-columns:1fr 1fr}.stats>*:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}.section-head{align-items:flex-start}.row{grid-template-columns:62px 26px 1fr}nav{overflow-x:auto;justify-content:flex-start}.overlay{align-items:end}.modal{border-radius:20px 20px 0 0}.actions{align-items:stretch;flex-direction:column}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const today='2026-08-28';
const seed={
 chickens:[
  {id:'mabel',name:'Mabel',breed:'Buff Orpington',eggColor:'Light brown',notes:'Professional nest hog.'},
  {id:'daisy',name:'Daisy',breed:'Easter Egger',eggColor:'Blue',notes:'Escape artist.'},
  {id:'susan',name:'Susan',breed:'Barred Rock',eggColor:'Brown',notes:'Under observation.'},
  {id:'henrietta',name:'Henrietta',breed:'Rhode Island Red',eggColor:'Brown',notes:'Molting.'},
  {id:'betty',name:'Betty',breed:'Australorp',eggColor:'Brown',notes:'Very respectable citizen.'},
  {id:'nugget',name:'Nugget',breed:'Silkie',eggColor:'Cream',notes:'Tiny and operational.'}
 ],
 events:[
  {id:'e1',type:'egg',source:'manual',chickenId:'mabel',at:'2026-08-28T09:14:00',data:{color:'Light brown'}},
  {id:'e2',type:'coop_exit',source:'camera',chickenId:'susan',at:'2026-08-28T07:03:00'},
  {id:'e3',type:'coop_exit',source:'camera',chickenId:'daisy',at:'2026-08-28T06:44:00'},
  {id:'e4',type:'coop_exit',source:'camera',chickenId:'mabel',at:'2026-08-28T06:42:00'},
  {id:'e6',type:'coop_exit',source:'camera',chickenId:'henrietta',at:'2026-08-28T06:55:00'},
  {id:'e7',type:'coop_exit',source:'camera',chickenId:'betty',at:'2026-08-28T06:46:00'},
  {id:'e8',type:'coop_exit',source:'camera',chickenId:'nugget',at:'2026-08-28T07:11:00'},
  {id:'r1',type:'coop_enter',source:'camera',chickenId:'mabel',at:'2026-08-27T19:51:00'},
  {id:'r2',type:'coop_enter',source:'camera',chickenId:'daisy',at:'2026-08-27T19:48:00'},
  {id:'r3',type:'coop_enter',source:'camera',chickenId:'susan',at:'2026-08-27T19:42:00'},
  {id:'r4',type:'coop_enter',source:'camera',chickenId:'henrietta',at:'2026-08-27T19:50:00'},
  {id:'r5',type:'coop_enter',source:'camera',chickenId:'betty',at:'2026-08-27T19:53:00'},
  {id:'r6',type:'coop_enter',source:'camera',chickenId:'nugget',at:'2026-08-27T19:37:00'},
  {id:'b1',type:'behavior',source:'manual',chickenId:'susan',at:'2026-08-26T12:00:00',data:{behavior:'Lethargic'}},
  {id:'b2',type:'behavior',source:'manual',chickenId:'susan',at:'2026-08-27T12:00:00',data:{behavior:'Lethargic'}},
  {id:'b3',type:'behavior',source:'manual',chickenId:'susan',at:'2026-08-28T08:00:00',data:{behavior:'Lethargic'}}
 ],
 offenders:[
  {id:'o1',animal:'Rat',source:'camera',at:'2026-08-28T00:18:00',place:'Feed area',note:'Camera detected'},
  {id:'o2',animal:'Rat',source:'manual',at:'2026-08-27T06:15:00',place:'Coop door',note:'Saw it under the waterer'},
  {id:'o3',animal:'Rat',source:'camera',at:'2026-08-26T23:48:00',place:'Feed area',note:'Camera detected'},
  {id:'o4',animal:'Rat',source:'manual',at:'2026-08-24T07:04:00',place:'Run',note:'Ran behind the feeder'},
  {id:'o5',animal:'Rat',source:'camera',at:'2026-08-22T01:22:00',place:'Feed area',note:'Camera detected'},
  {id:'o6',animal:'Raccoon',source:'camera',at:'2026-08-28T02:13:00',place:'Coop door',note:'Camera detected'}
 ],
 watches:[
  {id:'w1',kind:'offender_count',animal:'Rat',count:3,days:7,enabled:true},
  {id:'w2',kind:'behavior_streak',chickenId:'susan',behavior:'Lethargic',days:3,enabled:true}
 ], alerts:[]
};
let state=(()=>{try{const x=JSON.parse(localStorage.getItem('cluckops-v07')||localStorage.getItem('cluckops-v06'));return x&&x.events&&x.watches?x:structuredClone(seed)}catch{return structuredClone(seed)}})();
let view='home',selected='mabel',modal=null,cameraActive=false,review=[{id:'d1',icon:'🐔',label:'Probably Susan',confidence:61,type:'chicken',review:true,time:'7:03 AM'},{id:'d2',icon:'🦝',label:'Probably raccoon',confidence:94,type:'intruder',review:true,time:'2:13 AM'}];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem('cluckops-v07',JSON.stringify(state))} function chicken(id){return state.chickens.find(c=>c.id===id)} function activeChickens(){return state.chickens.filter(c=>!c.movedFromFlockAt)} function pastChickens(){return state.chickens.filter(c=>c.movedFromFlockAt)}
function fmt(at){const d=new Date(at);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})} function day(at){return String(at).slice(0,10)}
function eventLabel(e){const c=chicken(e.chickenId);if(e.type==='egg')return ['🥚',`${c?.name||'Chicken'} · egg logged`];if(e.type==='coop_exit')return ['🐔',`${c?.name||'Chicken'} left the coop`];if(e.type==='coop_enter')return ['🐔',`${c?.name||'Chicken'} returned to the coop`];if(e.type==='behavior')return ['👀',`${c?.name||'Chicken'} · ${e.data?.behavior||'behavior observed'}`];if(e.type==='health')return ['❤️',`${c?.name||'Chicken'} · health observation`];if(e.type==='treatment')return ['💊',`${c?.name||'Chicken'} · treatment logged`];return ['📷',`${c?.name||'Chicken'} · event logged`]}
function rollCall(){const ids=new Set(activeChickens().map(c=>c.id));const exits=new Set(state.events.filter(e=>e.type==='coop_exit'&&day(e.at)===today&&ids.has(e.chickenId)).map(e=>e.chickenId));const enters=new Set(state.events.filter(e=>e.type==='coop_enter'&&day(e.at)==='2026-08-27'&&ids.has(e.chickenId)).map(e=>e.chickenId));return {exits,enters}}
function watchText(w){if(w.kind==='offender_count')return `Alert me if ${w.animal.toLowerCase()} sightings reach ${w.count} or more within ${w.days} days.`;if(w.kind==='behavior_streak')return `Alert me if ${chicken(w.chickenId)?.name||'Chicken'} is reported as “${w.behavior}” for ${w.days} consecutive days.`;if(w.kind==='no_exit')return `Alert me if ${chicken(w.chickenId)?.name} hasn't left the coop by ${w.time}.`;if(w.kind==='no_egg')return `Alert me if ${chicken(w.chickenId)?.name} has no egg logged for ${w.days} days.`;return 'Custom watch'}
function evaluateWatches(){const generated=[];for(const w of state.watches.filter(x=>x.enabled!==false&&(!x.chickenId||!chicken(x.chickenId)?.movedFromFlockAt))){let fired=false,detail='';if(w.kind==='offender_count'){const cutoff=new Date('2026-08-28T23:59:59');cutoff.setDate(cutoff.getDate()-w.days);const n=state.offenders.filter(o=>o.animal===w.animal&&new Date(o.at)>=cutoff).length;fired=n>=w.count;detail=`${n} ${w.animal.toLowerCase()} sightings in ${w.days} days.`}if(w.kind==='behavior_streak'){const dates=[...new Set(state.events.filter(e=>e.type==='behavior'&&e.chickenId===w.chickenId&&e.data?.behavior===w.behavior).map(e=>day(e.at)))].sort();let streak=1,max=dates.length?1:0;for(let i=1;i<dates.length;i++){const a=new Date(dates[i-1]+'T00:00:00'),b=new Date(dates[i]+'T00:00:00');streak=((b-a)/86400000===1)?streak+1:1;max=Math.max(max,streak)}fired=max>=w.days;detail=`${w.behavior} reported on ${max} consecutive days.`}if(fired)generated.push({watchId:w.id,title:w.kind==='offender_count'?`🐀 ${w.animal} activity needs attention`:`👀 ${chicken(w.chickenId)?.name} needs attention`,detail})}
 const existing=new Map(state.alerts.map(a=>[a.watchId,a]));for(const g of generated){if(!existing.has(g.watchId))state.alerts.unshift({id:uid(),watchId:g.watchId,status:'new',createdAt:'2026-08-28T09:15:00',...g})}save()}
function needsAttention(){return state.alerts.some(a=>a.status!=='resolved')}
function btn(text,action,kind='primary'){return `<button class="btn ${kind}" data-action="${action}">${text}</button>`}
function render(){evaluateWatches();const rc=rollCall(),active=activeChickens(),past=pastChickens(),rats=state.offenders.filter(o=>o.animal==='Rat'),ratCam=rats.filter(o=>o.source==='camera').length,ratManual=rats.length-ratCam,c=chicken(selected)||active[0]||past[0],attention=needsAttention();let body='';
if(view==='home'){const ev=state.events.filter(e=>day(e.at)===today).sort((a,b)=>new Date(b.at)-new Date(a.at));body=`<main><div class="stats"><button class="card stat" data-nav="flock"><span>🐔</span><strong>${active.length} / ${active.length}</strong><small>in your flock</small></button><button class="card stat" data-action="open-log"><span>🥚</span><strong>${state.events.filter(e=>e.type==='egg'&&day(e.at)===today).length} today</strong><small>eggs logged</small></button><button class="card stat" data-nav="alerts"><span>${attention?'🟠':'🟢'}</span><strong>${attention?'Needs attention':'Normal'}</strong><small>flock status</small></button></div><section><div class="section-head"><div><h2>Roll call</h2><p class="muted">Derived from coop camera events.</p></div><small>Camera observed</small></div><div class="two"><div class="card"><span class="big">🌅</span><h2>${rc.exits.size} / ${active.length}</h2><p>Up & out</p><small>${rc.exits.size===active.length?'Everybody accounted for':'Missing: '+active.filter(x=>!rc.exits.has(x.id)).map(x=>x.name).join(', ')}</small></div><div class="card"><span class="big">🌙</span><h2>${rc.enters.size} / ${active.length}</h2><p>Safe inside last night</p><small>${rc.enters.size===active.length?'Everybody accounted for':'Missing: '+active.filter(x=>!rc.enters.has(x.id)).map(x=>x.name).join(', ')}</small></div></div></section><section><div class="section-head"><h2>Today</h2><small>Shared event history</small></div><div class="list">${ev.map(e=>{const [i,t]=eventLabel(e);return `<div class="row"><small>${fmt(e.at)}</small><span>${i}</span><div>${esc(t)}</div></div>`}).join('')}</div></section></main>`}
if(view==='flock')body=`<main><div class="section-head"><div><h2>The Ladies</h2><p class="muted">${active.length} active flock member${active.length===1?'':'s'}.</p></div>${btn('+ Chicken','open-add')}</div><div class="list cards">${active.map(x=>{const eggs=state.events.filter(e=>e.type==='egg'&&e.chickenId===x.id).length,alert=state.alerts.some(a=>a.status!=='resolved'&&state.watches.find(w=>w.id===a.watchId)?.chickenId===x.id);return `<button class="card chicken-card" data-profile="${x.id}"><div><strong>${esc(x.name)}</strong><small>${esc(x.breed)} · ${eggs} logged eggs</small><p>${alert?'🟠 Needs attention':'🟢 Normal'}</p></div><span class="big">🐔</span></button>`}).join('')||'<div class="card"><strong>No active chickens</strong><p class="muted">Add a chicken when your flock is ready.</p></div>'}</div>${past.length?`<section><div class="section-head"><div><h2>Past flock members</h2><p class="muted">Still part of your flock story.</p></div></div><div class="list cards">${past.map(x=>`<button class="card chicken-card" data-profile="${x.id}"><div><strong>${esc(x.name)}</strong><small>${esc(x.breed)} · flock member through ${new Date(x.movedFromFlockAt).getFullYear()}</small><p class="muted">View history</p></div><span class="big">🐔</span></button>`).join('')}</div></section>`:''}</main>`;
if(view==='profile'){const hist=state.events.filter(e=>e.chickenId===c.id).sort((a,b)=>new Date(b.at)-new Date(a.at)),isPast=!!c.movedFromFlockAt;body=`<main>${btn('← My flock','back-flock','ghost')}<div class="profile-head"><div class="avatar">🐔</div><div><h2>${esc(c.name)}</h2><p>${esc(c.breed)}</p>${isPast?'<span class="pill">Past flock member</span>':''}</div></div>${isPast?`<div class="card"><strong>Still part of your flock story.</strong><p>${c.moveReason==='Passed away'?'Passed away':c.moveReason==='Rehomed'?'Rehomed':c.moveReason?esc(c.moveReason):'Moved from active flock'} · ${day(c.movedFromFlockAt)}</p><small>No longer included in roll calls, watches, laying counts, or new camera activity.</small></div>`:''}<div class="card"><h2>Personality file</h2><p>${esc(c.notes||'No notes yet.')}</p></div><div class="actions">${btn('Edit '+esc(c.name),'open-edit','ghost')}${isPast?btn('Return to flock','restore-chicken','ghost'):btn('Move from flock','open-move','ghost')}</div><section><div class="history-title"><h2>History</h2><small>Kept forever · manual + camera events</small></div><div class="list">${hist.map(e=>{const [i,t]=eventLabel(e);return `<div class="row"><small>${day(e.at)}</small><span>${i}</span><div>${esc(t)}<small>${fmt(e.at)} · ${esc(e.source)}</small></div></div>`}).join('')||'<p class="muted">No history yet.</p>'}</div></section></main>`}
if(view==='camera')body=`<main>${!cameraActive?`<div class="card"><h2>Camera</h2><label>Name<input value="Coop Door"/></label><label>Connection<select><option>CluckOps test camera</option><option>IP camera / RTSP</option></select></label></div><div class="card zone"><div class="zone-label top">INSIDE COOP</div><div class="line"></div><div class="house">🏠</div><div class="zone-label bottom">OUTSIDE / YARD</div></div>${btn('Activate camera','activate-camera')}`:`<div class="card"><div class="section-head"><div><h2>Coop Door</h2><p class="muted">🟢 Camera online · simulated detection pipeline</p></div>${btn('Setup','deactivate-camera','ghost')}</div><div class="feed">📹</div><div class="actions">${btn('🐔 Simulate chicken exit','sim-chicken','ghost')}${btn('🐀 Simulate intruder','sim-intruder','ghost')}</div></div><section><div class="section-head"><h2>Detection review</h2><small>Corrections create shared events</small></div>${review.map(d=>`<div class="card"><strong>${d.icon} ${esc(d.label)}</strong><p class="muted">${d.time} · ${d.confidence}% confidence</p>${d.review?`<div class="actions">${(d.type==='chicken'?activeChickens().map(x=>x.name).concat(['Unknown chicken']):['Raccoon','Rat','Cat','Something else']).map(x=>`<button class="chip" data-review="${d.id}|${esc(x)}">${esc(x)}</button>`).join('')}</div>`:'<small>✓ Accepted into shared history</small>'}</div>`).join('')}</section>`}</main>`;
if(view==='alerts')body=`<main><div class="section-head"><div><h2>Alert history</h2><p class="muted">Watch-generated alerts with lifecycle.</p></div><span class="pill">${state.alerts.filter(a=>a.status!=='resolved').length} open</span></div><div class="list cards">${state.alerts.map(a=>`<div class="card alert"><strong>${esc(a.title)}</strong><p>${esc(a.detail)}</p><small>From watch: ${esc(watchText(state.watches.find(w=>w.id===a.watchId)||{}))}</small><div class="alert-actions">${a.status==='new'?btn('Acknowledge','ack-'+a.id,'ghost'):''}${a.status!=='resolved'?btn('Resolve','resolve-'+a.id,'ghost'):'<span class="pill">Resolved</span>'}</div></div>`).join('')||'<div class="card"><strong>🟢 All quiet</strong><p>No watches are firing.</p></div>'}<div class="card pattern"><small>Post-MVP pattern insight</small><h2>🐀 Yo, rats are about to rise up.</h2><p>${rats.length} rat sightings in 7 days. ${ratCam} camera · ${ratManual} reported.</p></div></main>`;
if(view==='offenders')body=`<main><div class="stats"><div class="card stat"><span>🐀</span><strong>${rats.length}</strong><small>${ratCam} camera · ${ratManual} reported</small></div><div class="card stat"><span>🦝</span><strong>${state.offenders.filter(o=>o.animal==='Raccoon').length}</strong><small>raccoon sightings</small></div></div><div class="actions">${btn('+ Report offender','open-offender')}${btn('📹 Simulate camera rat','sim-camera-rat','ghost')}</div><div class="list cards">${state.offenders.sort((a,b)=>new Date(b.at)-new Date(a.at)).map(o=>`<div class="card offender"><div><strong>${o.animal==='Rat'?'🐀':o.animal==='Raccoon'?'🦝':'🐾'} ${esc(o.animal)} sighting</strong><small>${day(o.at)} · ${fmt(o.at)} · ${esc(o.place)}</small><p>${esc(o.note)}</p></div><small>${o.source==='camera'?'📹 Camera':'✍️ Reported'}</small></div>`).join('')}</div></main>`;
if(view==='watches')body=`<main><div class="section-head"><div><h2>Active watches</h2><p class="muted">These are executable rules now.</p></div>${btn('+ Watch','open-watch')}</div><div class="list cards">${state.watches.map(w=>`<div class="card"><strong>${esc(watchText(w))}</strong><small>Evaluates shared history → creates Alert + Needs attention</small></div>`).join('')}</div></main>`;
const title={home:'Good morning 👋',flock:'My flock',profile:c?.name||'Chicken',camera:'Coop Vision',alerts:'Alerts',offenders:'Offenders Log',watches:'Watches'}[view];$('#app').innerHTML=`<header><div><div class="eyebrow">CluckOps v0.7</div><h1>${esc(title)}</h1></div>${btn('+ Log','open-log')}</header>${body}<nav>${[['home','🏠','Home'],['flock','🐔','Flock'],['camera','📹','Camera'],['alerts','🚨','Alerts'],['offenders','🐀','Offenders'],['watches','👀','Watches']].map(([v,i,l])=>`<button data-nav="${v}" class="${view===v?'active':''}"><span>${i}</span><small>${l}</small></button>`).join('')}</nav>${modalHtml()}`;bind()}
function modalHtml(){if(!modal)return'';const close=btn('Close','close-modal','ghost');if(modal==='log')return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Log something</h2>${close}</div><form id="log-form"><label>Chicken<select name="chicken">${activeChickens().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>What happened?<select name="type"><option value="egg">🥚 Egg</option><option value="behavior">👀 Behavior</option><option value="health">❤️ Health</option><option value="treatment">💊 Treatment</option><option value="other">📷 Something else</option></select></label><label>Behavior / note<input name="note" placeholder="e.g. Lethargic"/></label><button class="btn primary">Save event</button></form></div></div>`;if(modal==='add')return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Add chicken</h2>${close}</div><form id="add-form"><label>Name<input name="name" required/></label><label>Breed<input name="breed"/></label><label>Egg color<input name="eggColor"/></label><label>Personality file<textarea name="notes"></textarea></label><button class="btn primary">Add to flock</button></form></div></div>`;if(modal==='edit'){const c=chicken(selected);return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Edit ${esc(c.name)}</h2>${close}</div><form id="edit-form"><label>Name<input name="name" required value="${esc(c.name)}"/></label><label>Breed<input name="breed" value="${esc(c.breed)}"/></label><label>Egg color<input name="eggColor" value="${esc(c.eggColor||'')}"/></label><label>Personality file<textarea name="notes">${esc(c.notes||'')}</textarea></label><button class="btn primary">Save changes</button></form></div></div>`}if(modal==='move'){const c=chicken(selected);return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Move ${esc(c.name)} from your flock?</h2>${close}</div><p>${esc(c.name)} will no longer be included in roll calls, watches, laying counts, or new camera activity.</p><p><strong>We'll keep her profile and full history.</strong></p><form id="move-form"><label>What happened?<select name="reason"><option>Passed away</option><option>Rehomed</option><option>Other</option></select></label><label>Note (optional)<input name="note" placeholder="Anything you want to remember"/></label><button class="btn primary">Move from flock</button></form></div></div>`}if(modal==='offender')return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Report offender</h2>${close}</div><form id="offender-form"><label>Offender<select name="animal"><option>Rat</option><option>Raccoon</option><option>Possum</option><option>Cat</option><option>Coyote</option></select></label><label>Where?<select name="place"><option>Feed area</option><option>Coop door</option><option>Run</option><option>Yard</option></select></label><label>Note<input name="note"/></label><button class="btn primary">Add to Offenders Log</button></form></div></div>`;if(modal==='watch')return `<div class="overlay"><div class="modal"><div class="section-head"><h2>Create executable watch</h2>${close}</div><form id="watch-form"><label>Condition<select name="kind" id="watch-kind"><option value="offender_count">Offender sightings reach a threshold</option><option value="behavior_streak">Behavior reported consecutive days</option><option value="no_exit">Chicken hasn't left by a time</option><option value="no_egg">No egg logged for several days</option></select></label><div id="watch-fields"></div><button class="btn primary">Save watch</button></form></div></div>`;return''}
function renderWatchFields(){const el=$('#watch-fields');if(!el)return;const k=$('#watch-kind').value,cs=`<label>Chicken<select name="chickenId">${activeChickens().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label>`;if(k==='offender_count')el.innerHTML=`<label>Offender<select name="animal"><option>Rat</option><option>Raccoon</option><option>Possum</option><option>Cat</option><option>Coyote</option></select></label><label>Sightings<input name="count" type="number" min="2" value="3"></label><label>Within days<input name="days" type="number" min="1" value="7"></label><p class="muted">Uses the combined Offenders Log: camera + manual.</p>`;if(k==='behavior_streak')el.innerHTML=cs+`<label>Behavior<input name="behavior" value="Lethargic"></label><label>Consecutive days<input name="days" type="number" min="2" value="3"></label>`;if(k==='no_exit')el.innerHTML=cs+`<label>By time<input name="time" type="time" value="10:00"></label>`;if(k==='no_egg')el.innerHTML=cs+`<label>Days<input name="days" type="number" min="1" value="3"></label>`}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;modal=null;render()});document.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>{selected=b.dataset.profile;view='profile';render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const [id,label]=b.dataset.review.split('|'),d=review.find(x=>x.id===id);if(d&&d.review){d.label=label;d.confidence=100;d.review=false;if(d.type==='chicken'&&label!=='Unknown chicken'){const c=state.chickens.find(x=>x.name===label);if(c)state.events.unshift({id:uid(),type:'coop_exit',source:'camera',chickenId:c.id,at:'2026-08-28T09:16:00'})}if(d.type==='intruder'&&!['Something else'].includes(label))state.offenders.unshift({id:uid(),animal:label,source:'camera',at:'2026-08-28T09:16:00',place:'Coop door',note:'Confirmed from detection review'});save();render()}});const wk=$('#watch-kind');if(wk){wk.onchange=renderWatchFields;renderWatchFields()}
const lf=$('#log-form');if(lf)lf.onsubmit=e=>{e.preventDefault();const f=new FormData(lf),type=String(f.get('type')),note=String(f.get('note')||'').trim();state.events.unshift({id:uid(),type,source:'manual',chickenId:String(f.get('chicken')),at:'2026-08-28T09:17:00',data:type==='behavior'?{behavior:note||'Observed behavior'}:{note}});save();modal=null;view='home';render()};const af=$('#add-form');if(af)af.onsubmit=e=>{e.preventDefault();const f=new FormData(af),name=String(f.get('name')||'').trim();if(!name)return;state.chickens.push({id:uid(),name,breed:String(f.get('breed')||'Breed unknown'),eggColor:String(f.get('eggColor')||'Unknown'),notes:String(f.get('notes')||'')});save();modal=null;view='flock';render()};const ef=$('#edit-form');if(ef)ef.onsubmit=e=>{e.preventDefault();const f=new FormData(ef),c=chicken(selected);c.name=String(f.get('name')||'').trim()||c.name;c.breed=String(f.get('breed')||'Breed unknown');c.eggColor=String(f.get('eggColor')||'Unknown');c.notes=String(f.get('notes')||'');save();modal=null;render()};const mf=$('#move-form');if(mf)mf.onsubmit=e=>{e.preventDefault();const f=new FormData(mf),c=chicken(selected);c.movedFromFlockAt='2026-08-28T09:30:00';c.moveReason=String(f.get('reason')||'Other');c.moveNote=String(f.get('note')||'');state.watches.filter(w=>w.chickenId===c.id).forEach(w=>w.enabled=false);state.alerts.filter(a=>state.watches.find(w=>w.id===a.watchId)?.chickenId===c.id&&a.status!=='resolved').forEach(a=>a.status='resolved');save();modal=null;view='flock';render()};const of=$('#offender-form');if(of)of.onsubmit=e=>{e.preventDefault();const f=new FormData(of);state.offenders.unshift({id:uid(),animal:String(f.get('animal')),source:'manual',at:'2026-08-28T09:18:00',place:String(f.get('place')),note:String(f.get('note')||'Reported by you')});save();modal=null;render()};const wf=$('#watch-form');if(wf)wf.onsubmit=e=>{e.preventDefault();const f=new FormData(wf),kind=String(f.get('kind')),w={id:uid(),kind,enabled:true};for(const k of ['animal','behavior','chickenId','time'])if(f.get(k))w[k]=String(f.get(k));for(const k of ['count','days'])if(f.get(k))w[k]=Number(f.get(k));state.watches.unshift(w);save();modal=null;render()}}
function action(a){if(a==='open-log')modal='log';else if(a==='open-add')modal='add';else if(a==='open-offender')modal='offender';else if(a==='open-watch')modal='watch';else if(a==='open-edit')modal='edit';else if(a==='open-move')modal='move';else if(a==='restore-chicken'){const c=chicken(selected);delete c.movedFromFlockAt;delete c.moveReason;delete c.moveNote;save();}else if(a==='close-modal')modal=null;else if(a==='back-flock')view='flock';else if(a==='activate-camera')cameraActive=true;else if(a==='deactivate-camera')cameraActive=false;else if(a==='sim-chicken')review.unshift({id:uid(),icon:'🐔',label:'Unknown chicken',confidence:58,type:'chicken',review:true,time:'Just now'});else if(a==='sim-intruder')review.unshift({id:uid(),icon:'🐀',label:'Unknown animal',confidence:87,type:'intruder',review:true,time:'Just now'});else if(a==='sim-camera-rat'){state.offenders.unshift({id:uid(),animal:'Rat',source:'camera',at:'2026-08-28T09:19:00',place:'Feed area',note:'Camera detected'});save()}else if(a.startsWith('ack-')){const x=state.alerts.find(z=>z.id===a.slice(4));if(x)x.status='acknowledged';save()}else if(a.startsWith('resolve-')){const x=state.alerts.find(z=>z.id===a.slice(8));if(x)x.status='resolved';save()}render()}
render();
</script>
</body>
</html>
